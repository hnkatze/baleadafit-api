services:
  db:
    image: postgres:16-alpine
    environment:
      # Todo el proyecto trabaja en UTC: el servidor no debe depender del host.
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: baleadafit
      POSTGRES_PASSWORD: baleadafit
      POSTGRES_DB: baleadafit
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
