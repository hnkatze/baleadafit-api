name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Los pushes a main no se cancelan entre sí: cortar un `railway up` a mitad de la
# subida deja el deploy a medias. En el resto de las ramas sí se cancela.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  validacion:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # El postinstall del proyecto corre `prisma generate`.
      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Pruebas e2e
        run: npm run test:e2e

      - name: Build
        run: npm run build

  deploy:
    name: Deploy a Railway
    needs: validacion
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'baleadafit-api' }}
    steps:
      - uses: actions/checkout@v4

      - name: Exigir el token de Railway
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Falta el secreto RAILWAY_TOKEN. Se crea en Railway: Project Settings -> Tokens."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar el CLI de Railway
        run: npm install --global @railway/cli@5

      # --ci transmite solo el log del build y falla si el build falla. No espera
      # a que la app arranque: si la migración o el arranque fallan, se ve en el
      # deploy de Railway, no acá.
      - name: Deploy
        run: railway up --service "$RAILWAY_SERVICE" --ci
